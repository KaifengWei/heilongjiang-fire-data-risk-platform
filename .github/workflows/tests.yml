name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare geospatial Python environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: environment.yml
          activate-environment: fire-monitor
          auto-activate-base: false

      - name: Install test dependencies
        run: conda run -n fire-monitor python -m pip install -r requirements-dev.txt

      - name: Check JavaScript syntax
        run: |
          node --check static/product.js
          node --check static/map_viewport.js
          node --check static/county_drilldown.js
          node --check static/home.js
          node --check static/weather_context.js

      - name: Check Windows delivery PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @("scripts/build_and_check_exe.ps1", "scripts/finalize_windows_delivery.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref] $tokens, [ref] $parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax errors found: $path"
            }
          }

      - name: Run unit tests
        run: conda run -n fire-monitor python -m pytest -q
