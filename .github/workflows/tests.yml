name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare geospatial Python environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          environment-file: environment.yml
          activate-environment: fire-monitor
          auto-activate-base: false

      - name: Install test dependencies
        run: conda run -n fire-monitor python -m pip install -r requirements-dev.txt

      - name: Check JavaScript syntax
        run: |
          node --check static/product.js
          node --check static/county_drilldown.js
          node --check static/home.js

      - name: Run unit tests
        run: conda run -n fire-monitor python -m pytest -q
